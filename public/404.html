<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mohamed | Portfolio</title>
    <script>
      // SPA redirect for GitHub Pages
      // Stores the current path and redirects to index.html
      var pathSegmentsToKeep = 1; // number of path segments in the base (e.g. /UI-UX-Designer/)
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
